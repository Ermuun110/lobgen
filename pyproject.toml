[project]
name = "lobgen"
version = "0.1.0"
description = "Synthetic limit order book event generation, scored on LOB-Bench"
authors = [
    { name = "Ermuun110", email = "ermuunh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "sortedcontainers>=2.4.0",
]

[project.scripts]
lobgen = "lobgen.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
]
dev = [
    "pytest>=9.2.0",
]
model = [
    "torch>=2.5",
]
